# ────────────────────────────────────────────────────────────────
# Site configuration
#
# Edit this file to change your name, meta description, profile
# image, and social links. All values support both English and
# Chinese via `en` / `zh` keys.
# ────────────────────────────────────────────────────────────────

# Your name (used for the page title, <h1>, and <meta> tags)
name:
  en: Yongyi Zang
  zh: 臧永宜

# Meta description (fallback when a more specific one isn't set)
description:
  en: AI Researcher
  zh: AI 研究员

# Profile image — path relative to /public. Also the picture in link previews
# (X, LinkedIn, WeChat…) for every page that doesn't have a cover of its own,
# so keep it square and at least 600px wide.
profileImage: /profile.jpg

# Google Analytics 4 measurement ID ("G-…"). Remove the line to turn analytics
# off. It is only added to production builds, never to `npm run dev`.
googleAnalyticsId: G-LWPLNJ0FG3

# Social links — rendered as a row of text links under the bio.
# Add/remove/reorder freely. `label` is shown, `url` is the target.
links:
  - label: email
    url: mailto:zang@yongyi.dev
  - label: linkedin
    url: https://www.linkedin.com/in/yongyi-zang
  - label: scholar
    url: https://scholar.google.com/citations?user=B6Nw9jMAAAAJ
  - label: github
    url: https://github.com/yongyizang
  - label: x
    url: https://x.com/yongyi_zang
